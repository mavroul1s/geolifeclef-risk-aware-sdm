seed: 2025
run_name: landsat_tcn_smoke
data:
  train_path: data/processed/landsat_pa_smoke_train.npz
  val_path: data/processed/landsat_pa_smoke_val.npz
model:
  name: temporal_cnn
  modality: landsat
  channels: 32
  dropout: 0.15
training:
  batch_size: 128
  epochs: 6
  lr: 0.0008
  weight_decay: 0.0001
  num_workers: 0
  mixed_precision: true
  early_stopping_patience: 3
evaluation:
  threshold: 0.5
