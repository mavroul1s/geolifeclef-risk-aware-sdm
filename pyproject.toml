[build-system]
requires = ["setuptools>=75.0", "wheel>=0.44"]
build-backend = "setuptools.build_meta"

[project]
name = "geolifeclef-risk-aware-sdm"
version = "0.1.0"
description = "Efficient, reliable multimodal species-distribution modelling for GeoLifeCLEF 2025."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.3",
  "PyYAML==6.0.2",
  "scikit-learn==1.5.2",
  "scipy>=1.10,<2",
  "torch==2.5.1",
  "tqdm==4.67.1",
  "kaggle==1.6.17",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.8.4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
